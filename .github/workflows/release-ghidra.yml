# Builds a shippable Ghidra distribution from a tag and opens a draft release.
#
# Protocol:  git tag v12.2-optimized.1 && git push origin v12.2-optimized.1
# The artifact is named by the tree it is built from, not by the tag:
#   ghidra_<application.version>_<application.release.name>_<build date>.zip
# so a 12.2 release must be tagged on a branch that carries application.version=12.2.
#
# macOS note: the distribution ships no mac_arm_64 decompiler native (same gap as
# upstream 12.1.4/12.2). Run build-ghidra-multi-platform-artifact.yml for
# per-platform natives, or build it locally with
#   make ghidra_opt ARCH_TYPE="-arch arm64" OSDIR=mac_arm_64
# in Ghidra/Features/Decompiler/src/decompile/cpp.

name: Release Ghidra

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v12.2-optimized.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify version matches the tag
        run: |
          VERSION=$(awk -F'=' '$1=="application.version" {print $2}' Ghidra/application.properties)
          RELEASE=$(awk -F'=' '$1=="application.release.name" {print $2}' Ghidra/application.properties)
          echo "tree reports ${VERSION} / ${RELEASE}"
          case "$RELEASE_TAG" in
            *"$VERSION"*) ;;
            *) echo "::error::tag $RELEASE_TAG does not match application.version=$VERSION"; exit 1 ;;
          esac

      - name: Read Ghidra JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VER }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build distribution
        run: ./gradlew buildGhidra --parallel

      - name: Checksums
        run: |
          cd build/dist
          test -n "$(ls ghidra_*.zip)" || { echo "::error::no distribution zip produced"; exit 1; }
          shasum -a 256 ghidra_*.zip | tee SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghidra-distribution
          path: |
            build/dist/ghidra_*.zip
            build/dist/SHA256SUMS
          if-no-files-found: error

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            build/dist/ghidra_*.zip build/dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TAG" \
            --draft \
            --generate-notes
